name: CI - RP Utilidades Store

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: 'rp-utilidades-store/package-lock.json'

    - name: Install Dependencies
      run: npm ci

    - name: Run Linter (Oxlint)
      run: npm run lint

    - name: Build Project (Vite)
      run: npm run build
